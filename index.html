<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطة الفريق التنفيذي بمحافظة الخرج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4FAF9; --panel:#FFFFFF; --panel-alt:#EEF7F6; --ink:#1E2A2A; --ink-soft:#57696A; --ink-faint:#8B9C9C;
  --line:#E1EDEB; --line-strong:#C7DBD8; --primary:#00A38E; --primary-2:#00BFA6; --primary-tint:#E1F5F2;
  --accent:#0B7A6C; --accent-tint:#DCEFEC; --ok:#00A38E; --ok-bg:#E1F5F2; --warn:#B4771F; --warn-bg:#FBEDD8;
  --danger:#B25B4E; --danger-bg:#F9EBE8; --radius-s:4px; --radius:7px; --radius-l:12px;
  --shadow:0 1px 2px rgba(30,42,42,.05), 0 6px 18px -8px rgba(30,42,42,.09);
  --font:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --page-gradient: linear-gradient(180deg, #E7F5F3 0%, #F2FAF9 30%, #FBFEFE 60%, #FFFFFF 100%);
  --btn-primary-bg:#00A38E; --btn-primary-fg:#FFFFFF;
  --btn-accent-bg:#0B7A6C; --btn-accent-fg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1716; --panel:#101E1D; --panel-alt:#142523; --ink:#E6F0EF; --ink-soft:#A6BDBB; --ink-faint:#748C8A;
    --line:#1F3634; --line-strong:#2C4D49; --primary:#2DD4BE; --primary-2:#4EE2CE; --primary-tint:#123330;
    --accent:#1FA592; --accent-tint:#122C29; --ok:#2DD4BE; --ok-bg:#0F2B27; --warn:#E4A855; --warn-bg:#332711;
    --danger:#E28477; --danger-bg:#33201C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    --page-gradient: linear-gradient(180deg, #0F2926 0%, #12201F 25%, #0D1615 60%, #0B1716 100%);
    --btn-primary-bg:#1FA592; --btn-primary-fg:#04120F;
    --btn-accent-bg:#178577; --btn-accent-fg:#EAFBF8;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1716; --panel:#101E1D; --panel-alt:#142523; --ink:#E6F0EF; --ink-soft:#A6BDBB; --ink-faint:#748C8A;
  --line:#1F3634; --line-strong:#2C4D49; --primary:#2DD4BE; --primary-2:#4EE2CE; --primary-tint:#123330;
  --accent:#1FA592; --accent-tint:#122C29; --ok:#2DD4BE; --ok-bg:#0F2B27; --warn:#E4A855; --warn-bg:#332711;
  --danger:#E28477; --danger-bg:#33201C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --page-gradient: linear-gradient(180deg, #0F2926 0%, #12201F 25%, #0D1615 60%, #0B1716 100%);
  --btn-primary-bg:#1FA592; --btn-primary-fg:#04120F;
  --btn-accent-bg:#178577; --btn-accent-fg:#EAFBF8;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; font-family:var(--font); background:var(--page-gradient, var(--bg)); background-attachment:fixed; color:var(--ink); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased; min-height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--page-gradient, var(--bg));}
button,input,select,textarea{font-family:inherit; color:inherit;}
.wrap{max-width:620px; margin:0 auto; padding:26px 18px 60px;}
.brand{display:flex; align-items:center; gap:11px; margin-bottom:18px;}
.brand-mark{width:auto; height:46px; border-radius:0; background:none; display:flex; align-items:center; justify-content:center; flex:none;}
.brand-mark img{height:100%; width:auto; display:block;}
.brand h1{font-size:16px; margin:0; font-weight:800;}
.brand p{font-size:12px; color:var(--ink-soft); margin:2px 0 0;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:20px;}
.notice{display:flex; gap:10px; padding:12px 14px; border-radius:var(--radius); background:var(--accent-tint); border:1px solid var(--accent); font-size:12.8px; color:var(--ink); align-items:flex-start; margin-bottom:18px;}
:root[data-theme="dark"] .notice{color:var(--accent);}
.notice svg{width:16px; height:16px; stroke:currentColor; fill:none; flex:none; margin-top:1px;}
.step{display:flex; gap:12px; padding:14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-alt); margin-bottom:12px;}
.step-num{width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; flex:none;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:2px;}
.field label{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
.input, select.input{border:1px solid var(--line-strong); background:var(--panel); color:var(--ink); border-radius:var(--radius-s); padding:9px 11px; font-size:13.5px; width:100%;}
.input:focus, select.input:focus{border-color:var(--primary-2); box-shadow:0 0 0 3px var(--primary-tint); outline:none;}
.radio-schools{display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:240px; overflow-y:auto;}
.school-opt{border:1px solid var(--line-strong); border-radius:var(--radius); padding:10px 12px; cursor:pointer; font-size:13px; display:flex; align-items:flex-start; gap:8px;}
.school-opt:hover{border-color:var(--primary-2);}
.school-opt.sel{border-color:var(--primary); background:var(--primary-tint);}
.help-text{font-size:12px; color:var(--ink-faint);}
.cal-field{position:relative;}
.cal-trigger{width:100%; text-align:right; cursor:pointer;}
.cal-pop{position:absolute; z-index:60; top:calc(100% + 6px); right:0; background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:0 16px 40px -10px rgba(0,0,0,.25); padding:12px; width:280px;}
.cal-pop-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.cal-title{font-weight:800; font-size:13px;}
.cal-nav-btn{border:1px solid var(--line-strong); background:var(--panel-alt); border-radius:6px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:800; color:var(--ink-soft);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-wd{font-size:10.5px; text-align:center; color:var(--ink-faint); font-weight:700; padding-bottom:4px;}
.cal-cell{aspect-ratio:1; border:none; background:transparent; border-radius:6px; font-size:12px; cursor:pointer; color:var(--ink);}
.cal-cell.empty{cursor:default;}
.cal-cell:not(.empty):hover{background:var(--panel-alt); outline:1px solid var(--line-strong);}
.cal-cell.cal-sel{outline:2px solid var(--primary); font-weight:800;}
.cal-cell.cal-today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line);}
.cal-legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-soft);}
.cal-legend-dot{width:9px; height:9px; border-radius:3px; flex:none;}
.btn{appearance:none; border:1px solid var(--line-strong); background:var(--panel); color:var(--ink); padding:11px 16px; border-radius:var(--radius); font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none;}
.btn-primary{background:var(--btn-primary-bg); border-color:var(--btn-primary-bg); color:var(--btn-primary-fg); font-weight:800;}
.btn-whatsapp{background:#25D366; border-color:#25D366; color:#fff;}
.btn-mail{background:var(--primary-2); border-color:var(--primary-2); color:#fff;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.send-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
.summary-box{background:var(--panel-alt); border:1px solid var(--line); border-radius:var(--radius); padding:14px; font-size:13px; line-height:2; margin-top:16px;}
.summary-box b{color:var(--primary);}
:root[data-theme="dark"] .summary-box b{color:var(--primary-2);}
.done-box{text-align:center; padding:30px 16px;}
.done-box svg{width:46px; height:46px; stroke:var(--ok); margin-bottom:12px;}
@media (max-width:480px){ .send-grid{grid-template-columns:1fr;} .radio-schools{grid-template-columns:1fr;} }
.btn-emailjs{background:var(--btn-accent-bg); border-color:var(--btn-accent-bg); color:var(--btn-accent-fg); font-weight:800;}
.spin{width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function schoolsFor(supId){
  if(isSpecialist(supId)){
    const sp = SPECIALIST_SUPERVISORS.find(s=>s.id===supId);
    return SEED.schools.filter(s=>s.gender===(sp&&sp.gender));
  }
  return SEED.schools.filter(s=>s.supervisorId===supId);
}

  const rows = state.visits.slice().sort((a,b)=>a.date.localeCompare(b.date));

    const sc = SEED.schools.find(s=>s.id===v.school);

function buildMessage(){
  const sp = supById(state.supervisor);
  const rows = state.visits.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const lines = rows.map(function(v){
    const sc = SEED.schools.find(s=>s.id===v.school);
    return '- '+v.date+' ('+weekdayArabic(v.date)+'): '+(sc?sc.name:'');
  });
  return '📋 خطة زيارات ميدانية شهرية — '+monthLabel(state.month)+'\n'+
    'المشرف: '+(sp?sp.name:'')+'\n'+
    'النطاق: '+(sp? (isSpecialist(sp.id)? (sp.domain||'اختصاصي') : sp.nitaq) : '')+'\n'+
    'عدد أيام الزيارة: '+rows.length+'\n'+
    '—\n'+lines.join('\n')+'\n—\nمُرسلة عبر نموذج تسجيل الخطط';
}

function sendAuto(){
  if(!window.emailjs){ state.sendError = 'تعذّر الاتصال بخدمة الإرسال (تحقّق من الاتصال بالإنترنت)'; render(); return; }
  const sp = supById(state.supervisor);
  state.sending = true; state.sendError = ''; render();
  const params = {
    name: sp ? sp.name : '',
    title: 'خطة زيارات '+monthLabel(state.month)+' — '+(sp?sp.name:''),
    message: buildMessage(),
    email: SEND_EMAIL,
    time: new Date().toLocaleString('ar-SA'),
  };
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params).then(function(){
    state.sending = false; state.sent = true; render();
  }, function(err){
    state.sending = false;
    state.sendError = 'تعذّر إرسال البريد تلقائياً' + (err && err.text ? ' ('+err.text+')' : '');
    render();
  });
}

/* ---------- calendar ---------- */
function calendarGridHtml(viewMonth, selected){
  const [y,m] = viewMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const weekdayLabels = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const monthTitle = first.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long', year:'numeric'});
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push('<div class="cal-cell empty"></div>');
  const typesUsed = new Set();
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const h = holidayFor(dateStr);
    let style='', cls='cal-cell';
    if(h){ cls+=' cal-holiday'; style='background:'+TYPE_META[h.type].bg+'; color:'+TYPE_META[h.type].color+'; font-weight:700; cursor:not-allowed; opacity:.85;'; typesUsed.add(h.type); }
    if(selected===dateStr) cls+=' cal-sel';
    if(dateStr===todayISO()) cls+=' cal-today';
    cells.push(h
      ? '<button type="button" class="'+cls+'" style="'+style+'" disabled title="'+esc(h.label)+' — إجازة، لا يمكن اختيار هذا اليوم">'+d+'</button>'
      : '<button type="button" class="'+cls+'" style="'+style+'" data-act="cal-pick" data-date="'+dateStr+'">'+d+'</button>');
  }
  const legend = [...typesUsed].map(t=>'<div class="cal-legend-item"><span class="cal-legend-dot" style="background:'+TYPE_META[t].color+';"></span>'+TYPE_META[t].label+'</div>').join('');
  return '<div class="cal-pop-head"><button type="button" class="cal-nav-btn" data-act="cal-nav" data-dir="1">›</button><div class="cal-title">'+monthTitle+'</div><button type="button" class="cal-nav-btn" data-act="cal-nav" data-dir="-1">‹</button></div>'+
    '<div class="cal-grid">'+weekdayLabels.map(w=>'<div class="cal-wd">'+w+'</div>').join('')+cells.join('')+'</div>'+
    (legend? '<div class="cal-legend">'+legend+'</div>' : '');
}
let calViewMonth = todayISO().slice(0,7);
function toggleCal(){
  const pop = document.getElementById('calPop');
  const willOpen = pop.hidden;
  pop.hidden = true;
  if(willOpen){
    if(state.month) calViewMonth = state.month;
    pop.innerHTML = calendarGridHtml(calViewMonth, state.curDate); pop.hidden = false;
  }
}
function navCal(dir){
  let [y,m] = calViewMonth.split('-').map(Number);
  m += dir; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  calViewMonth = y+'-'+String(m).padStart(2,'0');
  document.getElementById('calPop').innerHTML = calendarGridHtml(calViewMonth, state.curDate);
}
function pickCalDate(dateStr){
  state.curDate = dateStr;
  const pop = document.getElementById('calPop');
  if(pop) pop.hidden = true;
  render();
}

document.addEventListener('click', function(e){
  if(!e.target.closest('#calField')){ const p=document.getElementById('calPop'); if(p) p.hidden=true; }
  const t = e.target.closest('[data-act]');
  if(t){
    const act = t.dataset.act;
    if(act==='pick-school'){ state.curSchool = t.value; render(); return; }
    if(act==='cal-nav'){ navCal(Number(t.dataset.dir)); return; }
    if(act==='cal-pick'){ pickCalDate(t.dataset.date); return; }
    if(act==='remove-visit'){
      const rows = state.visits.slice().sort((a,b)=>a.date.localeCompare(b.date));
      const idx = Number(t.dataset.idx);
      const target = rows[idx];
      state.visits = state.visits.filter(v=>v!==target);
      render();
      return;
    }
  }
  if(e.target.id==='calTrigger'){ toggleCal(); return; }
  if(e.target.id==='addVisitBtn' && !e.target.disabled){
    if(state.curDate && state.curSchool){
      const exists = state.visits.some(v=>v.date===state.curDate);
      if(exists){ state.visits = state.visits.filter(v=>v.date!==state.curDate); }
      state.visits.push({ date: state.curDate, school: state.curSchool });
      state.curDate = ''; state.curSchool = '';
      render();
    }
    return;
  }
  if(e.target.closest && e.target.closest('#sendAutoBtn') && !document.getElementById('sendAutoBtn').disabled){
    sendAuto();
    return;
  }
  if(e.target.closest && e.target.closest('#downloadPlanPdfBtn')){ printMyPlan(); return; }
  if(e.target.id==='newPlanBtn'){ state = { nitaq:'', supervisor:'', month:'', visits:[], curDate:'', curSchool:'', sent:false, sending:false, sendError:'' }; render(); return; }
});

document.addEventListener('change', function(e){
  if(e.target.id==='nitaqSelect'){ state.nitaq = e.target.value; state.supervisor=''; state.curSchool=''; render(); return; }
  if(e.target.id==='supSelect'){ state.supervisor = e.target.value; state.curSchool=''; render(); return; }
  if(e.target.id==='monthSelect'){ state.month = e.target.value; render(); return; }
});

render();
</script>
</body>
</html>
