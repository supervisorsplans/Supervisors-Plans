<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استبيان معامل الكيمياء</title>
<style>
/* Layout: single column form on a ledger-like sheet; green ministry-adjacent palette, Tajawal + Noto Naskh */
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
:root{--bg:#f2f8f7;--card:#ffffff;--fg:#12202b;--mut:#5b6f6c;--line:#d6e6e3;--accent:#0B7A6C;--accent-fg:#ffffff;--soft:#e1f5f2;--warn-bg:#fbedd8;--warn-fg:#7a5200;--bad:#b3261e;--ok:#0B7A6C;--sheet:#fbfefd;--primary:#00A38E}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{border-top:6px solid var(--primary);background:var(--bg);color:var(--fg);font-family:'Tajawal',system-ui,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px;padding-block:24px}
.wrap{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{color:var(--accent);font-family:'Noto Naskh Arabic','Tajawal',serif;font-size:28px;margin:0;line-height:1.4;text-wrap:balance}
.sub{color:var(--mut);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
label{font-weight:700;display:block;margin-bottom:6px}
select{width:100%;font:inherit;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rank{display:flex;gap:12px;align-items:flex-start;min-width:0}
.rank .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;margin-top:30px}
.rank .f{flex:1;min-width:0}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:12px 14px;font-weight:500}
button.go{font:inherit;font-weight:700;background:linear-gradient(135deg,#00A38E,#0B7A6C);color:var(--accent-fg);border:0;border-radius:10px;padding:13px 18px;min-height:48px;cursor:pointer}
button.go[disabled]{opacity:.5;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;font-weight:500}
.msg.ok{background:var(--soft);color:var(--ok)}.msg.err{background:var(--warn-bg);color:var(--bad)}
.sum ol{margin:0;padding-inline-start:22px}
.tabs{display:flex;gap:8px}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
th{background:var(--soft);font-size:13px}
.dupe{color:var(--bad);font-weight:700}

.logo{display:block;margin:0 auto 6px;width:120px;height:auto}
.bar{height:5px;border-radius:3px;background:linear-gradient(270deg,#07A869,#0DA9A6,#3D7EB9)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chip{background:var(--soft);border-radius:10px;padding:8px 12px;min-width:0}.chip span{display:block;font-size:12.5px;color:var(--mut)}.chip b{word-break:break-word}
.nt{background:var(--soft);border-inline-start:4px solid #C1B48A;border-radius:8px;padding:10px 14px;font-size:14px}
textarea{width:100%;font:inherit;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
</style>
</head><body>

/* بوابة فتح/إغلاق التسجيل — تقرأ status.json وتُغلق النموذج تلقائياً حسب الإعدادات والمواعيد (توقيت الرياض) */
(function(){
  var KEY='labs', cfg=null, overlay=null, banner=null;
  function ms(t){ if(!t) return null; var v=Date.parse(t+':00+03:00'); return isNaN(v)?null:v; }
  function fmt(v){
    var d=new Date(v), o={timeZone:'Asia/Riyadh'};
    try{
      var g=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{timeZone:'Asia/Riyadh',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
      var h=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{timeZone:'Asia/Riyadh',day:'numeric',month:'long',year:'numeric'}).format(d).replace(/[‎‏]/g,'');
      var t=new Intl.DateTimeFormat('ar-SA-u-nu-latn',{timeZone:'Asia/Riyadh',hour:'numeric',minute:'2-digit',hour12:true}).format(d);
      return g+' م — '+h+' — الساعة '+t;
    }catch(e){ return d.toLocaleString(); }
  }
  function state(){
    var c=cfg&&cfg[KEY]; if(!c) return {open:true};
    if(c.mode==='closed') return {open:false,why:'manual',msg:c.message};
    if(c.mode==='open') return {open:true};
    var o=ms(c.opensAt), x=ms(c.closesAt), n=Date.now();
    if(o!==null && n<o) return {open:false,why:'before',at:o,msg:c.message};
    if(x!==null && n>=x) return {open:false,why:'after',at:x,msg:c.message};
    return {open:true,closes:x};
  }
  function left2(l){ var m=Math.max(1,Math.ceil(l/60000)), h=Math.floor(m/60), mm=m%60, p=[];
    if(h>0) p.push(h===1?'ساعة':(h===2?'ساعتان':h+(h<11?' ساعات':' ساعة')));
    if(mm>0) p.push(mm===1?'دقيقة':(mm===2?'دقيقتان':mm+(mm<11?' دقائق':' دقيقة')));
    return p.join(' و '); }
  var warned=false;
  function warnOnce(left,closes){

    var d=document.createElement('div');

    d.querySelector('button').onclick=function(){ d.remove(); };
    document.body.appendChild(d);
  }
  function box(html,bg,fg){ var d=document.createElement('div'); d.style.cssText='direction:rtl;font-family:Tajawal,Segoe UI,Tahoma,sans-serif;'; d.innerHTML=html; return d; }
  function render(){
    var s=state(), wrap=document.querySelector('.wrap');

      if(!overlay){

        '<p style="margin:0 0 8px;color:#3b4552;line-height:1.9;font-size:15px">'+line+'</p>'+

        if(near) warnOnce(left,s.closes);
      } else if(banner){ banner.remove(); banner=null; }
    }

  }
  load(); setInterval(load,60000); setInterval(render,15000);
})();
