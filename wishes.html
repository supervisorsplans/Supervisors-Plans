<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رغبات دعم التميز</title>
<style>
/* Layout: single column form on a ledger-like sheet; green ministry-adjacent palette, Tajawal + Noto Naskh */
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap');
:root{--bg:#f2f8f7;--card:#ffffff;--fg:#12202b;--mut:#5b6f6c;--line:#d6e6e3;--accent:#0B7A6C;--accent-fg:#ffffff;--soft:#e1f5f2;--warn-bg:#fbedd8;--warn-fg:#7a5200;--bad:#b3261e;--ok:#0B7A6C;--sheet:#fbfefd;--primary:#00A38E}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{border-top:6px solid var(--primary);background:var(--bg);color:var(--fg);font-family:'Tajawal',system-ui,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px;padding-block:24px}
.wrap{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{color:var(--accent);font-family:'Noto Naskh Arabic','Tajawal',serif;font-size:28px;margin:0;line-height:1.4;text-wrap:balance}
.sub{color:var(--mut);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
label{font-weight:700;display:block;margin-bottom:6px}
select{width:100%;font:inherit;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rank{display:flex;gap:12px;align-items:flex-start;min-width:0}
.rank .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;margin-top:30px}
.rank .f{flex:1;min-width:0}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:12px 14px;font-weight:500}
button.go{font:inherit;font-weight:700;background:linear-gradient(135deg,#00A38E,#0B7A6C);color:var(--accent-fg);border:0;border-radius:10px;padding:13px 18px;min-height:48px;cursor:pointer}
button.go[disabled]{opacity:.5;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;font-weight:500}
.msg.ok{background:var(--soft);color:var(--ok)}.msg.err{background:var(--warn-bg);color:var(--bad)}
.sum ol{margin:0;padding-inline-start:22px}
.tabs{display:flex;gap:8px}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
th{background:var(--soft);font-size:13px}
.dupe{color:var(--bad);font-weight:700}
</style>
</head><body>

<script>
const NAMES=["بدر محمد حسن بن جدوع", "خالد محمد سعد الداوود", "عبدالرحمن بن عبدالله بن عبدالرحمن بن جطيل", "عبدالعزيز عبدالله محمد بن غملاس", "محمد بن عبدالله بن شايع المطرفي", "عبيد سليمان عبدالله الرشيدي", "محمد بن حسن بن احمد الغريبي", "عبدالله حسن شارع الرمثي", "مسلم جليميد صويان الدوسري"];
const SCHOOLS=["ابتدائية أبي عبيدة عامر بن الجراح", "ابتدائية أحمد بن حنبل", "ابتدائية أنس بن مالك", "ابتدائية ابن القيم", "ابتدائية الأندلس", "ابتدائية التوضحية", "ابتدائية الحزم", "ابتدائية الراشدية", "ابتدائية السلمية", "ابتدائية السهباء", "ابتدائية الشديدة", "ابتدائية القدس", "ابتدائية الملك فيصل", "ابتدائية الناصفة", "ابتدائية الواحة", "ابتدائية اليمامة", "ابتدائية سعيد بن زيد", "ابتدائية طارق بن زياد", "ابتدائية عبادة بن الصامت", "ابتدائية عبدالله بن رواحة", "متوسطة ابن العميد", "متوسطة ابن خلدون", "متوسطة ابن رشد", "متوسطة الإمام أبي حنيفة", "متوسطة الإمام القرطبي", "متوسطة الإمام مالك", "متوسطة الخوارزمي", "متوسطة الرفايع", "متوسطة السيح", "متوسطة الشيخ محمد بن إبراهيم", "متوسطة الضبيعة", "متوسطة المدينة المنورة", "متوسطة الملك سعود", "متوسطة الهياثم", "متوسطة الواحة", "متوسطة اليمامة", "متوسطة حنين", "متوسطة زميقة", "متوسطة عبدالرحمن الغافقي", "متوسطة معاوية بن أبي سفيان"];

const SEND_EMAIL='supervisorsplans@gmail.com';
const EMAILJS_PUBLIC_KEY='qvCKHpMCsPcX0bq4F',EMAILJS_SERVICE_ID='service_z3joklk',EMAILJS_TEMPLATE_ID='template_mei5f4q';
if(window.emailjs) emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
const $=id=>document.getElementById(id);
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة'];
const who=$('who');
NAMES.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;who.appendChild(o)});
const ranks=$('ranks');
let lastPicks=null,lastName='';
function buildRanks(){
  ranks.innerHTML='';
  ORD.forEach((o,i)=>{
    const d=document.createElement('div');d.className='rank';
    const n=document.createElement('div');n.className='n';n.textContent=i+1;
    const f=document.createElement('div');f.className='f';
    const l=document.createElement('label');l.htmlFor='r'+i;l.textContent='الرغبة '+o;
    const s=document.createElement('select');s.id='r'+i;
    s.innerHTML='<option value="">اختر المدرسة…</option>';
    SCHOOLS.forEach(x=>{const op=document.createElement('option');op.value=x;op.textContent=x;s.appendChild(op)});
    s.addEventListener('change',refresh);
    f.appendChild(l);f.appendChild(s);d.appendChild(n);d.appendChild(f);ranks.appendChild(d);
  });
  refresh();
}
function vals(){return ORD.map((_,i)=>$('r'+i).value)}
function refresh(){
  const v=vals();
  ORD.forEach((_,i)=>{[...$('r'+i).options].forEach(op=>{op.disabled=!!op.value&&v.some((x,j)=>j!==i&&x===op.value)})});
  $('send').disabled=!(who.value&&v.every(Boolean));
}
function show(el,on){el.hidden=!on}
function say(t,k){const s=$('status');s.className='msg '+k;s.textContent=t;s.hidden=false}
who.addEventListener('change',()=>{
  const on=!!who.value;
  ranks.style.display=on?'flex':'none';ranks.hidden=!on;show($('note'),on);show($('send'),on);show($('done'),false);show($('status'),false);
  if(on)buildRanks();
});
function stamp(){
  const d=new Date(),tz={timeZone:'Asia/Riyadh'};
  const day=d.toLocaleDateString('ar-SA',Object.assign({weekday:'long'},tz));
  const g=d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',Object.assign({year:'numeric',month:'long',day:'numeric'},tz));
  const hj=d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',Object.assign({year:'numeric',month:'long',day:'numeric'},tz));
  const t=d.toLocaleTimeString('ar-SA-u-nu-latn',Object.assign({hour:'2-digit',minute:'2-digit',hour12:true},tz));
  return {day,g,hj,t};
}
function msgText(name,picks,st){
  st=st||stamp();

const XL={dark:'0B5F5C',main:'0E8F8A',light:'E3F4F3',zebra:'F5FBFA',border:'B9D9D7',gold:'C9A227'};
async function buildXlsx(name,picks,st){
  if(!window.ExcelJS) return null;
  const wb=new ExcelJS.Workbook();
  wb.creator='فيصل الدغريري';wb.lastModifiedBy='فيصل الدغريري';wb.company='الإدارة العامة للتعليم بمنطقة الرياض — نطاق محافظة الخرج';wb.created=new Date();
  const ws=wb.addWorksheet('الرغبات',{views:[{rightToLeft:true,showGridLines:false}],pageSetup:{orientation:'portrait',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true}});
  ws.getColumn(1).width=8;ws.getColumn(2).width=18;ws.getColumn(3).width=52;
  const logoId=wb.addImage({base64:LOGO_B64,extension:'png'});
  const ncols=3;
  const thin={style:'thin',color:{argb:'FF'+XL.border}},border={top:thin,left:thin,bottom:thin,right:thin};
  ['المملكة العربية السعودية','وزارة التعليم','الإدارة العامة للتعليم بمنطقة الرياض','نطاق محافظة الخرج'].forEach((line,i)=>{
    ws.mergeCells(i+1,1,i+1,ncols);const c=ws.getCell(i+1,1);c.value=line;
    c.alignment={horizontal:'center',vertical:'middle'};c.font={name:'Arial',bold:true,size:i===1?15:12,color:{argb:'FF'+XL.dark}};ws.getRow(i+1).height=i<2?26:22;
  });
  for(let c=1;c<=ncols;c++) ws.getCell(5,c).border={top:{style:'medium',color:{argb:'FF'+XL.gold}}};
  ws.addImage(logoId,{tl:{col:0.1,row:0.1},ext:{width:92,height:47},editAs:'oneCell'});
  ws.getRow(5).height=6;
  ws.mergeCells(6,1,6,ncols);const t=ws.getCell(6,1);t.value='رغبات مشرفي دعم التميز (بنين)';
  t.alignment={horizontal:'center',vertical:'middle'};t.font={name:'Arial',bold:true,size:14,color:{argb:'FFFFFFFF'}};t.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+XL.dark}};ws.getRow(6).height=30;
  const info=[['المشرف',name],['تاريخ التسجيل',st.day+' '+st.g+' م — '+st.hj],['وقت التسجيل',st.t]];
  info.forEach((p,i)=>{
    const r=7+i;ws.mergeCells(r,2,r,ncols);
    const a=ws.getCell(r,1);
    a.value=p[0];a.font={name:'Arial',bold:true,size:10.5,color:{argb:'FF'+XL.dark}};a.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+XL.light}};a.alignment={horizontal:'center',vertical:'middle'};a.border=border;
    const b=ws.getCell(r,2);b.value=p[1];b.font={name:'Arial',size:10.5,color:{argb:'FF1F2D2D'}};b.alignment={horizontal:'right',vertical:'middle',readingOrder:'rtl'};b.border=border;
    ws.getRow(r).height=22;
  });
  const hr=ws.getRow(11);hr.height=28;
  ['م','الرغبة','المدرسة'].forEach((x,i)=>{const c=hr.getCell(i+1);c.value=x;c.font={name:'Arial',bold:true,size:11,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+XL.main}};c.alignment={horizontal:'center',vertical:'middle'};c.border=border});
  picks.forEach((p,i)=>{
    const r=ws.getRow(12+i);r.height=24;
    [i+1,'الرغبة '+ORD[i],p].forEach((v,j)=>{const c=r.getCell(j+1);c.value=v;c.font={name:'Arial',size:10.5,bold:j===1,color:{argb:'FF1F2D2D'}};c.alignment={horizontal:j===2?'right':'center',vertical:'middle',wrapText:true,readingOrder:'rtl'};c.border=border;if(i%2===1)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+XL.zebra}}});
  });
  const fr=12+picks.length+1;ws.mergeCells(fr,1,fr,ncols);const f=ws.getCell(fr,1);
  f.value='الإدارة العامة للتعليم بمنطقة الرياض — نطاق محافظة الخرج';f.alignment={horizontal:'center'};f.font={name:'Arial',size:9,italic:true,color:{argb:'FF55706F'}};
  return await wb.xlsx.writeBuffer();
}
function b64(buf){let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
let lastXlsx=null;
$('send').addEventListener('click',async()=>{
  const picks=vals(),name=who.value;
  if(new Set(picks).size!==5){say('لا يمكن تكرار مدرسة في أكثر من رغبة.','err');return}
  if(!window.emailjs){say('تعذّر الاتصال بخدمة الإرسال، تحقّق من الاتصال بالإنترنت.','err');return}
  const b=$('send');b.disabled=true;b.textContent='جارِ الإرسال…';
  const st=stamp();
  let xl=null,att='';
  try{ xl=await buildXlsx(name,picks,st); if(xl) att='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+b64(xl); }catch(e){ xl=null;att=''; }
  const params={name:name,title:'رغبات دعم التميز — '+name,message:msgText(name,picks,st),email:SEND_EMAIL,time:st.day+' '+st.g+' — '+st.t};
  if(att&&att.length<40000){ params.attachment=att; params.attachment_name='رغبات_'+name.split(' ').slice(0,2).join('_')+'.xlsx'; }
  Promise.race([emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,params),new Promise((_,rj)=>setTimeout(()=>rj({text:'انتهت مهلة الاتصال'}),20000))]).then(()=>{
    lastPicks=picks;lastName=name;lastXlsx=xl;b.textContent='تم الإرسال ✓';
    show($('formView'),false);
    const dn=$('done');
    dn.querySelector('ol').innerHTML='';
    picks.forEach(p=>{const li=document.createElement('li');li.textContent=p;dn.querySelector('ol').appendChild(li)});
    $('stampline').textContent='وقت التسجيل: '+st.day+' '+st.g+' م — '+st.t;
    show($('xlsxbtn'),!!xl);
    show(dn,true);
  },err=>{
    b.textContent='إرسال الرغبات';b.disabled=false;
    const s=err&&err.status,det=err&&(err.text||err.message)||'';
    const why=s===429?'تجاوزت خدمة البريد حدّها المسموح، حاول لاحقاً.':s===403||s===412?'خدمة البريد رفضت الطلب (إعدادات الحساب).':'';
    say('تعذّر إرسال البريد. '+why+' ['+(s||'')+' '+det+'] أعد المحاولة.','err');
  });
});

$('xlsxbtn').addEventListener('click',()=>{if(!lastXlsx)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lastXlsx],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='رغبات_'+lastName.split(' ').slice(0,2).join('_')+'.xlsx';document.body.appendChild(a);a.click();a.remove()});
